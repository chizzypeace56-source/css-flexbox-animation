
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Ferris Wheel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Animated Ferris Wheel</h1>
    <p>Learning CSS Animation</p>
  </header>

  <main>
    <div class="wheel">
      <div class="spoke spoke1"></div>
      <div class="spoke spoke2"></div>
      <div class="spoke spoke3"></div>
      <div class="spoke spoke4"></div>
      <div class="spoke spoke5"></div>
      <div class="spoke spoke6"></div>

      <div class="cabin cabin1">1</div>
      <div class="cabin cabin2">2</div>
      <div class="cabin cabin3">3</div>
      <div class="cabin cabin4">4</div>
      <div class="cabin cabin5">5</div>
      <div class="cabin cabin6">6</div>

      <div class="center"></div>
    </div>

    <div class="stand"></div>
    <p class="caption">Enjoy the ride!</p>
  </main>

</body>
</html>
